<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SITAS 智能面试官系统</title>
  <!-- Vue3 + Bootstrap 均用 CDN，无需 Node 构建 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/static/css/style.css" rel="stylesheet" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
  <div id="app">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="#">🤖 SITAS 智能面试官</a>
        <div class="navbar-nav">
          <a class="nav-link" :class="{ active: currentView === 'candidate' }" href="#" @click.prevent="currentView = 'candidate'">候选人端</a>
          <a class="nav-link" :class="{ active: currentView === 'admin' }" href="#" @click.prevent="currentView = 'admin'">后台管理</a>
        </div>
      </div>
    </nav>

    <main class="container mt-4">
      <!-- 候选人端视图（成员C实现） -->
      <CandidateView v-if="currentView === 'candidate'"></CandidateView>
      <!-- 后台管理视图（成员C实现） -->
      <AdminView v-else></AdminView>
    </main>

    <footer class="text-center text-muted py-4">
      SITAS —— AI 智能面试官与人才评估系统 · 实习项目
    </footer>
  </div>

  <!-- 全局 API 封装（成员C维护） -->
  <script src="/static/js/api.js"></script>
  <!-- 各视图组件 -->
  <script src="/static/js/candidate.js"></script>
  <script src="/static/js/admin.js"></script>
  <script src="/static/js/interview.js"></script>
  <script src="/static/js/main.js"></script>
</body>
</html>
